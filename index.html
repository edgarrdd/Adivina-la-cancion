<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adivina la Canción</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECCIÓN INICIAL -->
    <section id="setup">
        <h1>🎵 Adivina la Canción</h1>
        <input id="artistInput" type="text" placeholder="Nombre del artista">
        <button id="startGameButton">Iniciar juego</button>
        <p id="message"></p>
    </section>

    <!-- SECCIÓN DEL JUEGO -->
    <section id="game" class="hidden">
        <h2 id="feedback"></h2>
        <p>Puntuación: <span id="currentScore">0</span> /10</p>

        <audio id="audioPlayer" controls></audio>

        <input id="songGuess" type="text" placeholder="Adivina la canción">
        <button id="submitGuessButton">Enviar</button>
        <button id="skipButton">Saltar</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
