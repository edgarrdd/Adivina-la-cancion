<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adivina la Canción</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="setup">
        <h1>🎵 Adivina la Canción (Spotify)</h1>
        <input id="artistInput" type="text" placeholder="Nombre del artista">
        <button id="startGameButton">Iniciar juego</button>
        <p id="message"></p>
    </section>

    <section id="game" class="hidden">
        <h2 id="feedback"></h2>
        <p>Puntuación: <span id="currentScore">0</span></p>

        <audio id="audioPlayer" controls></audio>

        <input id="songGuess" type="text" placeholder="Adivina el nombre">
        <button id="submitGuessButton">Enviar</button>
        <button id="skipButton">Saltar</button>
    </section>

    <script src="https://edgarrdd.github.io/Adivina-la-cancion/script.js"></script>

</body>
</html>
