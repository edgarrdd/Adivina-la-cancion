<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina la Canción</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Adivina la Canción</h1>

        <div class="busqueda">
            <input id="input-artista" type="text" placeholder="Ingresa un artista">
            <button id="btn-juego">Iniciar Juego</button>
        </div>

        <p id="mensaje"></p>

        <audio id="reproductor" controls></audio>

        <div class="respuesta">
            <input id="input-respuesta" type="text" placeholder="¿Qué canción es?">
            <button id="btn-enviar">Enviar</button>
        </div>

        <p id="resultado"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
