<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Callback Spotify</title>
</head>
<body>
  <p>Procesando autenticación...</p>
  <script>
    async function getToken() {
      const code = new URLSearchParams(window.location.search).get("code");
      const codeVerifier = localStorage.getItem("code_verifier");

      if (!code) {
        alert("Error: no se recibió el código de Spotify.");
        return;
      }

      const clientId = "1a1298904e0a4ca5a6ed6c58e222d083";
      const redirectUri = "https://edgarrdd.github.io/Adivina-la-cancion/callback";

      const body = new URLSearchParams({
        grant_type: "authorization_code",
        code: code,
        redirect_uri: redirectUri,
        client_id: clientId,
        code_verifier: codeVerifier
      });

      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      });

      const data = await response.json();

      if (data.access_token) {
        localStorage.setItem("spotify_token", data.access_token);
        window.location.href = "index.html";
      } else {
        alert("Error al obtener el token: " + JSON.stringify(data));
      }
    }

    getToken();
  </script>
</body>
</html>
